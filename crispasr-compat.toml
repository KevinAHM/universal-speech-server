schema_version = 1
repository = "CrispStrobe/CrispASR"
minimum_release = "v0.8.18"
binding_commit = "1be20080423620ab283af64bae96a3b575c36753"
binding_version = "0.4.9"

# A release is eligible only when its tag contains every required commit.
# PR #285 adds the session codec setter, the second commit supplies runtime
# seed control, the third exposes the canonical default-bundle ABI used by the
# model installer, and PR #289 supplies the VoxCPM2 AudioVAE S2S backend.
required_ancestor_commits = [
  "a492d3f72a8210502a35b54fd22cfe6ed1e42879",
  "e907acbcfaece247c52cfd69689a95185f3efe8a",
  "104d85be1d78cdf9559b16ee93ab5aa93d35b480",
  "de3409c67abf2c6cd620f0c2a291f472bc232622",
]

